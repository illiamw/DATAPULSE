services:

  # ============================================================
  # FASTAPI
  # ============================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: datapulse-api

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      - mlflow

    volumes:
      - ./data:/app_mlops/data
      - ./src:/app_mlops/src
      - ./scripts:/app_mlops/scripts

    restart: unless-stopped


  # ============================================================
  # MLFLOW
  # ============================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    container_name: datapulse-mlflow

    ports:
      - "5000:5000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      - postgres

    volumes:
      - ./mlruns:/mlruns

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlruns

    restart: unless-stopped


  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16

    container_name: datapulse-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data: